<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AX 발전소 · 통합 발전 모니터링</title><style>:root, [data-theme="dark"] {
  --bg: oklch(0.155 0.008 250);
  --panel: oklch(0.195 0.009 250);
  --panel2: oklch(0.235 0.01 250);
  --line: oklch(0.29 0.01 250);
  --line2: oklch(0.34 0.012 250);
  --tx: oklch(0.94 0.004 250);
  --tx2: oklch(0.74 0.008 250);
  --tx3: oklch(0.56 0.01 250);
  --solar: oklch(0.82 0.15 82);
  --fc: oklch(0.74 0.1 230);
  --irr: oklch(0.72 0.13 40);
  --ok: oklch(0.73 0.14 155);
  --warn: oklch(0.75 0.15 60);
  --crit: oklch(0.65 0.21 25);
  --minor: oklch(0.8 0.12 100);
  --comm: oklch(0.68 0.13 300);
  --sel: oklch(0.82 0.15 82 / 0.12);
  --future: oklch(1 0 0 / 0.025);
}
[data-theme="light"] {
  --bg: oklch(0.955 0.004 250);
  --panel: oklch(0.995 0.002 250);
  --panel2: oklch(0.955 0.005 250);
  --line: oklch(0.9 0.006 250);
  --line2: oklch(0.84 0.008 250);
  --tx: oklch(0.22 0.01 250);
  --tx2: oklch(0.42 0.012 250);
  --tx3: oklch(0.58 0.012 250);
  --solar: oklch(0.7 0.16 70);
  --fc: oklch(0.56 0.12 240);
  --irr: oklch(0.62 0.16 40);
  --ok: oklch(0.6 0.14 155);
  --warn: oklch(0.68 0.16 55);
  --crit: oklch(0.57 0.21 25);
  --minor: oklch(0.7 0.13 95);
  --comm: oklch(0.55 0.15 300);
  --sel: oklch(0.7 0.16 70 / 0.12);
  --future: oklch(0 0 0 / 0.025);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; overflow: hidden; }
body { font-family: 'IBM Plex Sans KR', sans-serif; color: var(--tx); -webkit-font-smoothing: antialiased; }
#root { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
.stage { width: 1920px; height: 1080px; background: var(--bg); color: var(--tx); transform-origin: center; position: absolute; left: 50%; top: 50%; display: flex; flex-direction: column; font-size: calc(13px * var(--text-scale, 1)); overflow: hidden; flex: none; }
.num, .mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
small.u { font-size: 0.55em; color: var(--tx3); margin-left: 3px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 500; letter-spacing: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ── 상단바 ── */
.top { height: 52px; flex: none; display: flex; align-items: center; gap: 0; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: center; gap: 10px; padding-right: 22px; border-right: 1px solid var(--line); height: 100%; }
.brand-mark { width: 22px; height: 22px; border-radius: 50%; background: var(--solar); position: relative; }
.brand-mark::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: var(--panel); }
.brand b { font-size: calc(15px * var(--text-scale, 1)); font-weight: 700; letter-spacing: -0.01em; }
.brand span { color: var(--tx3); font-size: calc(12px * var(--text-scale, 1)); }
.nav { display: flex; height: 100%; margin-left: 8px; }
.nav button { padding: 0 18px; height: 100%; color: var(--tx2); font-size: calc(14px * var(--text-scale, 1)); font-weight: 500; position: relative; display: flex; align-items: center; gap: 8px; }
.nav button:hover { color: var(--tx); }
.nav button.on { color: var(--tx); font-weight: 600; }
.nav button.on::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px; background: var(--solar); }
.nav .cnt { font-family: 'IBM Plex Mono', monospace; font-size: calc(11px * var(--text-scale, 1)); background: var(--crit); color: #fff; border-radius: 9px; padding: 0 6px; line-height: 17px; }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 22px; height: 100%; }
.tstat { display: flex; flex-direction: column; line-height: 1.2; }
.tstat label { font-size: calc(10.5px * var(--text-scale, 1)); color: var(--tx3); }
.tstat b { font-size: calc(13px * var(--text-scale, 1)); font-weight: 600; }
.clock { font-family: 'IBM Plex Mono', monospace; font-size: calc(22px * var(--text-scale, 1)); font-weight: 500; letter-spacing: 0; }
.clock-d { font-size: calc(11px * var(--text-scale, 1)); color: var(--tx3); text-align: right; line-height: 1.2; }
.live { display: flex; align-items: center; gap: 7px; font-size: calc(12px * var(--text-scale, 1)); color: var(--tx2); padding: 5px 10px; border: 1px solid var(--line); border-radius: 4px; }
.vsep { width: 1px; align-self: stretch; background: var(--line); margin: 10px 0; }

.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.pulse { animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in oklch, currentColor 0%, transparent), 0 0 0 0 var(--ok); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

/* ── 레이아웃 ── */
.main { flex: 1; min-height: 0; padding: 12px; display: grid; gap: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.ph { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 14px; border-bottom: 1px solid var(--line); flex: none; }
.ph h3 { font-size: calc(13.5px * var(--text-scale, 1)); font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
.ph-sub { font-size: calc(11.5px * var(--text-scale, 1)); color: var(--tx3); white-space: nowrap; }
.ph-r { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: calc(12px * var(--text-scale, 1)); color: var(--tx2); }
.pb { flex: 1; min-height: 0; padding: 12px 14px; position: relative; }

/* ── KPI ── */
.kpis { display: grid; grid-template-columns: 1.55fr 1.3fr 1fr 1fr 1.25fr 1.25fr 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.kpi { padding: 14px 18px 13px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi:last-child { border-right: 0; }
.kpi > label { font-size: calc(12px * var(--text-scale, 1)); color: var(--tx2); display: flex; align-items: center; gap: 6px; }
.kpi > label em { font-style: normal; color: var(--tx3); font-size: calc(11px * var(--text-scale, 1)); margin-left: auto; }
.kv { font-family: 'IBM Plex Mono', monospace; font-size: calc(30px * var(--text-scale, 1)); font-weight: 500; line-height: 1.15; letter-spacing: -0.02em; white-space: nowrap; }
.kv.xl { font-size: calc(42px * var(--text-scale, 1)); color: var(--solar); }
.kv small.u { font-size: calc(14px * var(--text-scale, 1)); }
.ksub { font-size: calc(11.5px * var(--text-scale, 1)); color: var(--tx3); display: flex; gap: 12px; white-space: nowrap; }
.ksub b { color: var(--tx2); font-weight: 500; font-family: 'IBM Plex Mono', monospace; }
.up { color: var(--ok) !important; } .dn { color: var(--crit) !important; }
.bar { background: var(--panel2); border-radius: 2px; overflow: hidden; width: 100%; }
.bar i { display: block; height: 100%; border-radius: 2px; transition: width .6s; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 2px; }
.trio div { display: flex; flex-direction: column; }
.trio label { font-size: calc(11px * var(--text-scale, 1)); color: var(--tx3); }
.trio b { font-family: 'IBM Plex Mono', monospace; font-size: calc(21px * var(--text-scale, 1)); font-weight: 500; }
.trio b small { font-size: calc(11px * var(--text-scale, 1)); color: var(--tx3); margin-left: 2px; font-weight: 400; }

/* ── 차트 ── */
.chart { position: relative; width: 100%; height: 100%; }
.chart svg { display: block; }
.grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.axis { stroke: var(--line2); }
.axl { fill: var(--tx3); font-size: calc(10.5px * var(--text-scale, 1)); font-family: 'IBM Plex Mono', monospace; }
.future { fill: var(--future); }
.nowline { stroke: var(--tx2); stroke-width: 1; stroke-dasharray: 3 2; }
.nowtag { fill: var(--tx); rx: 2; }
.nowtx { fill: var(--bg); font-size: calc(10px * var(--text-scale, 1)); font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
.cross { stroke: var(--tx3); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--panel2); border: 1px solid var(--line2); border-radius: 4px; padding: 7px 10px; min-width: 160px; font-size: calc(11.5px * var(--text-scale, 1)); z-index: 5; box-shadow: 0 6px 18px oklch(0 0 0 / .25); }
.tip-t { font-family: 'IBM Plex Mono', monospace; color: var(--tx2); margin-bottom: 4px; }
.tip-r { display: flex; align-items: center; gap: 6px; line-height: 1.6; color: var(--tx2); }
.tip-r i { width: 8px; height: 3px; border-radius: 1px; }
.tip-r b { margin-left: auto; color: var(--tx); font-family: 'IBM Plex Mono', monospace; font-weight: 500; padding-left: 12px; }
.legend { display: flex; gap: 14px; font-size: calc(11.5px * var(--text-scale, 1)); color: var(--tx2); }
.legend span { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 12px; height: 3px; border-radius: 1px; border-top: 0 solid; }
.legend i.dash { height: 0; border-top: 2px dashed; }
.spark { display: block; }

/* ── 테이블 ── */
table.t { width: 100%; border-collapse: collapse; font-size: calc(12.5px * var(--text-scale, 1)); }
.t th { text-align: left; font-weight: 500; color: var(--tx3); font-size: calc(11.5px * var(--text-scale, 1)); padding: 0 10px 8px; white-space: nowrap; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.t th.r, .t td.r { text-align: right; }
.t td { padding: 0 10px; height: 38px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t tbody tr { cursor: pointer; }
.t tbody tr:hover td { background: var(--panel2); }
.t tbody tr.sel td { background: var(--sel); }
.t td.num, .t td .num { font-family: 'IBM Plex Mono', monospace; }
.t th:first-child, .t td:first-child { padding-left: 0; }
.t th:last-child, .t td:last-child { padding-right: 0; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: calc(12px * var(--text-scale, 1)); color: var(--c); font-weight: 500; }
.sev { display: inline-block; font-size: calc(11px * var(--text-scale, 1)); font-weight: 600; padding: 1px 7px; border-radius: 3px; color: var(--c); background: color-mix(in oklch, var(--c) 16%, transparent); border: 1px solid color-mix(in oklch, var(--c) 40%, transparent); line-height: 16px; }
.mini { font-size: calc(11px * var(--text-scale, 1)); color: var(--tx3); }
.scroll { overflow: auto; }
.scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
.scroll::-webkit-scrollbar-track { background: transparent; }

/* 인버터 매트릭스 */
.invgrid { display: flex; flex-direction: column; gap: 9px; }
.invrow { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 10px; }
.invrow > label { font-size: calc(12px * var(--text-scale, 1)); color: var(--tx2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cells { display: flex; flex-wrap: wrap; gap: 3px; }
.cell { width: 24px; height: 24px; border-radius: 3px; position: relative; display: grid; place-items: center; font-size: calc(9.5px * var(--text-scale, 1)); font-family: 'IBM Plex Mono', monospace; color: oklch(0.2 0.01 250 / .75); cursor: pointer; transition: transform .1s; }
.cell:hover { transform: scale(1.12); z-index: 2; outline: 1.5px solid var(--tx); }
.cell.ring { outline: 2px solid var(--tx); outline-offset: 1px; }

/* 히트맵 */
.heat { display: grid; gap: 2px; }
.hc { border-radius: 2px; min-height: 0; cursor: default; }
.hlab { line-height: 1; overflow: hidden; min-height: 0; font-size: calc(9.5px * var(--text-scale, 1)); color: var(--tx3); font-family: 'IBM Plex Mono', monospace; display: flex; align-items: center; }

/* 알람 피드 */
.feed { display: flex; flex-direction: column; }
.fi { display: grid; grid-template-columns: 58px 44px 1fr; gap: 10px; align-items: start; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.fi:hover { background: var(--panel2); }
.fi .mono { color: var(--tx3); font-size: calc(11.5px * var(--text-scale, 1)); line-height: 18px; }
.fi p { font-size: calc(12.5px * var(--text-scale, 1)); line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fi p.s { font-size: calc(11px * var(--text-scale, 1)); color: var(--tx3); line-height: 15px; }
.fi.new { animation: flash 2.5s ease-out; }
@keyframes flash { 0%, 20% { background: color-mix(in oklch, var(--crit) 20%, transparent); } 100% { background: transparent; } }

/* 세그먼트 / 칩 */
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 4px; overflow: hidden; }
.seg button { padding: 4px 11px; font-size: calc(12px * var(--text-scale, 1)); color: var(--tx2); border-right: 1px solid var(--line2); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--panel2); color: var(--tx); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--line2); border-radius: 4px; font-size: calc(12.5px * var(--text-scale, 1)); color: var(--tx2); white-space: nowrap; }
.chip.on { border-color: var(--solar); color: var(--tx); background: var(--sel); }
.chip b { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
.btn { padding: 7px 14px; border-radius: 4px; border: 1px solid var(--line2); font-size: calc(12.5px * var(--text-scale, 1)); font-weight: 500; }
.btn:hover { background: var(--panel2); }
.btn.pri { background: var(--solar); border-color: var(--solar); color: oklch(0.2 0.02 80); font-weight: 600; }
.btn.pri:hover { filter: brightness(1.05); }
.btn:disabled { opacity: .4; cursor: default; }

/* 사이트 탭 (상세) */
.sitetabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.stab { padding: 11px 16px; text-align: left; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; position: relative; }
.stab:last-child { border-right: 0; }
.stab:hover { background: var(--panel2); }
.stab.on { background: var(--sel); }
.stab.on::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--solar); }
.stab .nm { font-size: calc(14px * var(--text-scale, 1)); font-weight: 600; display: flex; align-items: center; gap: 7px; }
.stab .meta { font-size: calc(11.5px * var(--text-scale, 1)); color: var(--tx3); display: flex; justify-content: space-between; }
.stab .meta b { font-family: 'IBM Plex Mono', monospace; color: var(--tx); font-weight: 500; font-size: calc(13px * var(--text-scale, 1)); }

.kv-list { display: grid; grid-template-columns: auto 1fr; column-gap: 14px; row-gap: 7px; font-size: calc(12.5px * var(--text-scale, 1)); }
.kv-list dt { color: var(--tx3); }
.kv-list dd { text-align: right; font-family: 'IBM Plex Mono', monospace; }
.statbox { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.statbox > div { background: var(--panel); padding: 9px 12px; display: flex; flex-direction: column; gap: 2px; }
.statbox label { font-size: calc(11px * var(--text-scale, 1)); color: var(--tx3); }
.statbox b { font-family: 'IBM Plex Mono', monospace; font-size: calc(18px * var(--text-scale, 1)); font-weight: 500; }
.statbox b small { font-size: calc(11px * var(--text-scale, 1)); color: var(--tx3); margin-left: 3px; font-weight: 400; font-family: 'IBM Plex Sans KR'; }

.empty { color: var(--tx3); font-size: calc(12.5px * var(--text-scale, 1)); display: grid; place-items: center; height: 100%; }
input.search { background: var(--panel2); border: 1px solid var(--line2); border-radius: 4px; padding: 6px 10px; font: inherit; font-size: calc(12.5px * var(--text-scale, 1)); color: var(--tx); width: 220px; outline: none; }
input.search:focus { border-color: var(--solar); }
.toast { position: absolute; right: 16px; top: 62px; z-index: 50; background: var(--panel2); border: 1px solid var(--crit); border-left-width: 1px; border-radius: 5px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px oklch(0 0 0 / .35); animation: tin .3s ease-out; max-width: 520px; cursor: pointer; }
@keyframes tin { from { transform: translateY(-8px); opacity: 0; } }

/* ── 사용자 선택 ── */
.rs-list { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.rs-card { display: grid; grid-template-columns: 44px 1fr auto 72px 84px 16px; align-items: center; gap: 16px; padding: 10px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; text-align: left; position: relative; flex: 1; max-height: 104px; min-height: 0; }
.rs-card:hover { border-color: var(--line2); background: color-mix(in oklch, var(--panel) 70%, var(--panel2)); }
.rs-card.on { border-color: var(--solar); background: var(--sel); }
.rs-card.on::before { content: ''; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 3px; background: var(--solar); border-radius: 6px 0 0 6px; }
.rs-av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--panel2); border: 1px solid var(--line2); font-weight: 600; font-size: calc(16px * var(--text-scale, 1)); color: var(--tx2); flex: none; }
.rs-card.on .rs-av { background: var(--solar); border-color: var(--solar); color: oklch(0.2 0.02 80); }
.rs-av.lg { width: 52px; height: 52px; font-size: calc(19px * var(--text-scale, 1)); background: var(--solar); border-color: var(--solar); color: oklch(0.2 0.02 80); }
.rs-av.sm { width: 28px; height: 28px; font-size: calc(12px * var(--text-scale, 1)); }
.rs-id { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rs-id b { font-size: calc(16px * var(--text-scale, 1)); font-weight: 600; letter-spacing: -0.01em; }
.rs-id span { font-size: calc(12.5px * var(--text-scale, 1)); color: var(--tx3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rs-pages { display: flex; gap: 4px; }
.rs-pages i { font-style: normal; font-size: calc(11.5px * var(--text-scale, 1)); padding: 3px 8px; border-radius: 3px; border: 1px dashed var(--line2); color: var(--tx3); opacity: .55; white-space: nowrap; }
.rs-pages i.on { border-style: solid; border-color: var(--line2); color: var(--tx); opacity: 1; background: var(--panel2); }
.rs-num { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.rs-num label { font-size: calc(11px * var(--text-scale, 1)); color: var(--tx3); }
.rs-num b { font-family: 'IBM Plex Mono', monospace; font-size: calc(18px * var(--text-scale, 1)); font-weight: 500; white-space: nowrap; }
.rs-num b small { font-size: calc(11px * var(--text-scale, 1)); color: var(--tx3); margin-left: 2px; font-weight: 400; font-family: 'IBM Plex Sans KR'; }
.rs-chev { color: var(--tx3); font-size: calc(22px * var(--text-scale, 1)); line-height: 1; }
.rs-card.on .rs-chev { color: var(--solar); }
.rs-detail { min-height: 0; }
.rs-h { font-size: calc(12px * var(--text-scale, 1)); color: var(--tx2); font-weight: 600; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }
.rs-h .mono { color: var(--tx3); font-weight: 400; }
.rs-sites { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.rs-site { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border: 1px dashed var(--line2); border-radius: 4px; font-size: calc(12.5px * var(--text-scale, 1)); color: var(--tx3); opacity: .5; }
.rs-site.on { border-style: solid; border-color: var(--line2); color: var(--tx); opacity: 1; background: var(--panel2); }
.rs-site b { font-weight: 500; }
.rs-site .mono { font-size: calc(11.5px * var(--text-scale, 1)); color: var(--tx3); }
.rs-pagelist { display: flex; flex-direction: column; gap: 8px; }
.rs-page { display: grid; grid-template-columns: 18px 26px 1fr auto; align-items: center; gap: 12px; padding: 13px 16px; border: 1px solid var(--line2); border-radius: 5px; text-align: left; }
.rs-page:hover:not(:disabled) { background: var(--panel2); }
.rs-page b { font-size: calc(14px * var(--text-scale, 1)); font-weight: 600; }
.rs-page > span > span { font-size: calc(12px * var(--text-scale, 1)); color: var(--tx3); }
.rs-page .rs-no { font-size: calc(12px * var(--text-scale, 1)); color: var(--tx3); }
.rs-page .rs-state { font-size: calc(11.5px * var(--text-scale, 1)); color: var(--tx3); }
.rs-page:disabled { opacity: .4; cursor: not-allowed; border-style: dashed; }
.rs-page.on { border-color: var(--solar); background: var(--sel); }
.rs-page.on .rs-state { color: var(--solar); font-weight: 600; }
.rs-radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line2); position: relative; }
.rs-page.on .rs-radio { border-color: var(--solar); }
.rs-page.on .rs-radio::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--solar); }
.who { display: flex; align-items: center; gap: 10px; padding: 5px 10px 5px 6px; border: 1px solid var(--line); border-radius: 5px; text-align: left; }
.who:hover { background: var(--panel2); border-color: var(--line2); }
.who-t { display: flex; flex-direction: column; line-height: 1.25; }
.who-t b { font-size: calc(12.5px * var(--text-scale, 1)); font-weight: 600; white-space: nowrap; }
.who-t span { font-size: calc(11px * var(--text-scale, 1)); color: var(--tx3); white-space: nowrap; }
.who-x { font-size: calc(11px * var(--text-scale, 1)); color: var(--tx2); border-left: 1px solid var(--line); padding-left: 10px; margin-left: 2px; }

.gapzone { fill: color-mix(in oklch, var(--warn) 10%, transparent); stroke: color-mix(in oklch, var(--warn) 50%, transparent); stroke-dasharray: 3 3; }
.gaptx { fill: var(--warn); font-size: calc(10px * var(--text-scale, 1)); font-weight: 600; }
.srcline { display: flex; align-items: center; gap: 7px; font-size: calc(11px * var(--text-scale, 1)); color: var(--tx3); white-space: nowrap; }
.srcline b { color: var(--tx2); font-weight: 500; font-family: 'IBM Plex Mono', monospace; }
.srcdot { width: 6px; height: 6px; border-radius: 1px; background: var(--comm); flex: none; }
.simbadge { display: flex; align-items: center; gap: 8px; font-size: calc(12px * var(--text-scale, 1)); color: var(--tx2); padding: 5px 10px; border: 1px solid color-mix(in oklch, var(--comm) 50%, var(--line)); border-radius: 4px; background: color-mix(in oklch, var(--comm) 8%, transparent); }
.simbadge b { color: var(--comm); font-weight: 600; }
.newchip { display: flex; align-items: center; gap: 7px; font-size: calc(12px * var(--text-scale, 1)); font-weight: 600; padding: 6px 11px; border-radius: 4px; border: 1px solid var(--solar); color: var(--tx); background: var(--sel); }
.newchip:hover { filter: brightness(1.08); }
.gaptag { display: inline-flex; align-items: center; gap: 4px; font-size: calc(11px * var(--text-scale, 1)); font-weight: 600; color: var(--warn); border: 1px dashed var(--warn); border-radius: 3px; padding: 0 6px; line-height: 16px; margin-left: 6px; }
/* 하단 행동 바 */
.actbar { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-top: 1px solid var(--line); background: var(--panel); border-radius: 0 0 6px 6px; }
.actbar .sel-t { font-size: calc(12.5px * var(--text-scale, 1)); color: var(--tx2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.actbar .sel-t b { color: var(--tx); font-weight: 600; }
/* 요약 띠 */
.band { display: grid; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.band button { padding: 12px 18px; text-align: left; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; position: relative; }
.band button:last-child { border-right: 0; }
.band button:hover { background: var(--panel2); }
.band button.on { background: var(--sel); }
.band button.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--solar); }
.band label { font-size: calc(12px * var(--text-scale, 1)); color: var(--tx2); cursor: pointer; }
.band b { font-family: 'IBM Plex Mono', monospace; font-size: calc(26px * var(--text-scale, 1)); font-weight: 500; }
.band b small { font-size: calc(12px * var(--text-scale, 1)); color: var(--tx3); margin-left: 3px; font-family: 'IBM Plex Sans KR'; font-weight: 400; }
.stagepill { display: inline-block; font-size: calc(11.5px * var(--text-scale, 1)); padding: 1px 8px; border-radius: 3px; border: 1px solid var(--line2); color: var(--tx2); background: var(--panel2); white-space: nowrap; }
.over { color: var(--crit); font-weight: 600; }
.chg { display: grid; grid-template-columns: 82px 1fr; gap: 10px; font-size: calc(12.5px * var(--text-scale, 1)); padding: 7px 0; border-bottom: 1px solid var(--line); color: var(--tx2); }
.chg .mono { color: var(--tx3); font-size: calc(11.5px * var(--text-scale, 1)); }
.flowline { display: flex; align-items: center; gap: 0; font-size: calc(11.5px * var(--text-scale, 1)); }
.flowline span { padding: 4px 10px; border: 1px solid var(--line2); color: var(--tx3); background: var(--panel); white-space: nowrap; }
.flowline span + span { border-left: 0; }
.flowline span:first-child { border-radius: 4px 0 0 4px; } .flowline span:last-child { border-radius: 0 4px 4px 0; }
.flowline span.done { color: var(--tx2); background: var(--panel2); }
.flowline span.cur { color: var(--tx); background: var(--sel); border-color: var(--solar); font-weight: 600; }
.demo-note { font-size: calc(11.5px * var(--text-scale, 1)); color: var(--comm); border: 1px solid color-mix(in oklch, var(--comm) 45%, transparent); background: color-mix(in oklch, var(--comm) 8%, transparent); border-radius: 4px; padding: 4px 10px; }

/* ── 업무 화면 공통 ── */
.page { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 12px; gap: 12px; }
.pgrid { flex: 1; min-height: 0; display: grid; gap: 12px; }
.tbar { height: 48px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 4px; }
.tbar h1 { font-size: calc(19px * var(--text-scale, 1)); font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
.tbar-m { font-size: calc(12.5px * var(--text-scale, 1)); color: var(--tx3); white-space: nowrap; }
.tbar-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.crumb { font-size: calc(13px * var(--text-scale, 1)); color: var(--tx2); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--line2); }
.crumb:hover { background: var(--panel2); color: var(--tx); }
.subnav { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); overflow: hidden; flex: none; }
.subnav button { padding: 10px 20px; font-size: calc(13.5px * var(--text-scale, 1)); color: var(--tx2); border-right: 1px solid var(--line); position: relative; display: flex; align-items: center; gap: 8px; }
.subnav button.on { color: var(--tx); font-weight: 600; background: var(--sel); }
.subnav button.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--solar); }
.subnav .sn-r { margin-left: auto; display: flex; align-items: center; gap: 12px; padding: 0 14px; }
.tabs { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); flex: none; padding: 0 14px; height: 40px; }
.tabs > button { padding: 0 14px; font-size: calc(13px * var(--text-scale, 1)); color: var(--tx2); position: relative; display: flex; align-items: center; gap: 6px; }
.tabs > button.on { color: var(--tx); font-weight: 600; }
.tabs > button.on::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--solar); }
.tabn { font-size: calc(11px * var(--text-scale, 1)); color: var(--tx3); }
.steps { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); flex: none; }
.step { display: flex; align-items: center; gap: 10px; padding: 11px 16px; font-size: calc(13px * var(--text-scale, 1)); color: var(--tx3); border-right: 1px solid var(--line); text-align: left; }
.step:last-child { border-right: 0; }
.step .mono { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line2); font-size: calc(11px * var(--text-scale, 1)); flex: none; }
.step.done { color: var(--tx2); }
.step.done .mono { background: var(--panel2); color: var(--ok); border-color: var(--ok); }
.step.cur { color: var(--tx); font-weight: 600; background: var(--sel); box-shadow: inset 0 -2px 0 var(--solar); }
.step.cur .mono { background: var(--solar); border-color: var(--solar); color: oklch(0.2 0.02 80); }
.step:disabled { cursor: default; }
.pager { display: flex; align-items: center; gap: 8px; }
.pager .btn { padding: 2px 9px; }
.imgslot { border: 1px solid var(--line2); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--tx3); font-size: calc(11.5px * var(--text-scale, 1)); background: repeating-linear-gradient(135deg, var(--panel2) 0 8px, var(--panel) 8px 16px); }
.fld { display: flex; flex-direction: column; gap: 5px; font-size: calc(12.5px * var(--text-scale, 1)); }
.fld-l { color: var(--tx2); font-weight: 500; }
.fld-l em { color: var(--crit); font-style: normal; }
.fld-e { color: var(--crit); font-size: calc(11.5px * var(--text-scale, 1)); }
.fld-h { color: var(--tx3); font-size: calc(11.5px * var(--text-scale, 1)); }
.inp, select.inp, textarea.inp { background: var(--panel2); border: 1px solid var(--line2); border-radius: 4px; padding: 7px 10px; font: inherit; font-size: calc(13px * var(--text-scale, 1)); color: var(--tx); outline: none; width: 100%; }
.inp:focus { border-color: var(--solar); }
textarea.inp { resize: vertical; min-height: 64px; line-height: 1.5; }
.note { font-size: calc(12px * var(--text-scale, 1)); padding: 7px 11px; border-radius: 4px; border: 1px solid; line-height: 1.5; }
.note-warn { color: var(--warn); border-color: color-mix(in oklch, var(--warn) 45%, transparent); background: color-mix(in oklch, var(--warn) 8%, transparent); }
.note-crit { color: var(--crit); border-color: color-mix(in oklch, var(--crit) 45%, transparent); background: color-mix(in oklch, var(--crit) 8%, transparent); }
.note-info { color: var(--tx2); border-color: var(--line2); background: var(--panel2); }
.src { font-size: calc(10.5px * var(--text-scale, 1)); padding: 1px 6px; border-radius: 3px; border: 1px solid color-mix(in oklch, var(--comm) 45%, transparent); color: var(--comm); white-space: nowrap; }
.judg { display: inline-flex; align-items: center; gap: 5px; font-size: calc(12px * var(--text-scale, 1)); font-weight: 500; color: var(--c); white-space: nowrap; }
.judg-und { padding: 0 5px; border-radius: 3px; background: repeating-linear-gradient(135deg, transparent 0 3px, color-mix(in oklch, var(--tx3) 25%, transparent) 3px 4px); }
.mdl-bg { position: absolute; inset: 0; background: oklch(0 0 0 / .45); z-index: 80; display: grid; place-items: center; }
.mdl { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; box-shadow: 0 20px 60px oklch(0 0 0 / .4); display: flex; flex-direction: column; max-height: 860px; }
.mdl-b { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
.mdl-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); }
.bell { position: relative; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 5px; display: grid; place-items: center; color: var(--tx2); }
.bell:hover { background: var(--panel2); }
.bell .cnt { position: absolute; top: -6px; right: -7px; font-family: 'IBM Plex Mono', monospace; font-size: calc(10.5px * var(--text-scale, 1)); background: var(--crit); color: #fff; border-radius: 9px; padding: 0 5px; line-height: 16px; }
.ctxsel { display: flex; flex-direction: column; line-height: 1.2; }
.ctxsel label { font-size: calc(10.5px * var(--text-scale, 1)); color: var(--tx3); }
.ctxsel select { background: transparent; border: 1px solid var(--line2); border-radius: 4px; color: var(--tx); font: inherit; font-size: calc(13px * var(--text-scale, 1)); font-weight: 600; padding: 3px 6px; margin-top: 2px; }
.ctxsel select option { background: var(--panel); }
.nav .navsim { color: var(--tx3); font-size: calc(12.5px * var(--text-scale, 1)); }
.pmap { display: grid; gap: 14px; align-content: start; }
.pzone { display: flex; flex-direction: column; gap: 4px; }
.pzone > span { font-size: calc(11px * var(--text-scale, 1)); color: var(--tx3); font-family: 'IBM Plex Mono', monospace; }
.pcells { display: grid; gap: 3px; }
.pc { height: 30px; border-radius: 3px; border: 1px solid var(--line2); background: var(--panel2); font-size: calc(9.5px * var(--text-scale, 1)); font-family: 'IBM Plex Mono', monospace; color: var(--tx3); position: relative; display: grid; place-items: center; cursor: pointer; }
.pc:hover { border-color: var(--tx2); }
.pc.soil { background: color-mix(in oklch, var(--warn) 22%, var(--panel2)); border-color: var(--warn); color: var(--warn); }
.pc.dmg { background: color-mix(in oklch, var(--crit) 22%, var(--panel2)); border-color: var(--crit); color: var(--crit); }
.pc.und { background: repeating-linear-gradient(135deg, var(--panel2) 0 3px, var(--line2) 3px 4.5px); }
.pc.sel { outline: 2px solid var(--solar); outline-offset: 1px; z-index: 2; }
.pc.chk::after { content: '✓'; position: absolute; top: -1px; right: 2px; font-size: calc(9px * var(--text-scale, 1)); color: var(--solar); font-weight: 700; }
.pc.rev::before { content: ''; position: absolute; left: 2px; top: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--fc); }
.pc.route { box-shadow: inset 0 0 0 1px var(--fc); }
.pc .ord { position: absolute; bottom: 1px; left: 3px; font-size: calc(8.5px * var(--text-scale, 1)); color: var(--fc); }
.meter { display: flex; height: 8px; border-radius: 2px; overflow: hidden; background: var(--panel2); }
.meter i { display: block; height: 100%; }
.gauge { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.gauge span { height: 10px; border-radius: 2px; background: var(--panel2); }
.gauge span.on { background: var(--c); }
.cal { display: grid; grid-template-columns: 56px repeat(7, 1fr); gap: 2px; font-size: calc(11px * var(--text-scale, 1)); }
.cal .ch { text-align: center; color: var(--tx2); padding: 4px 0; font-weight: 500; }
.cal .ct { color: var(--tx3); font-family: 'IBM Plex Mono', monospace; text-align: right; padding-right: 6px; line-height: 28px; }
.cal .cc { height: 28px; border-radius: 2px; background: radial-gradient(circle, var(--line2) 1px, transparent 1.3px) 0 0 / 6px 6px; border: 1px solid transparent; }
.cal .cc.av { background: color-mix(in oklch, var(--fc) 20%, var(--panel2)); cursor: pointer; border-color: color-mix(in oklch, var(--fc) 40%, transparent); }
.cal .cc.av:hover { border-color: var(--fc); }
.cal .cc.bk { background: var(--panel2); }
.cal .cc.pick { background: var(--solar); border-color: var(--solar); }
.evlog { font-family: 'IBM Plex Mono', monospace; font-size: calc(11.5px * var(--text-scale, 1)); }
.evlog div { display: grid; grid-template-columns: 62px 70px 170px 1fr; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); color: var(--tx2); }
.evlog div.ign { text-decoration: line-through; color: var(--tx3); }
.chkbox { width: 15px; height: 15px; accent-color: var(--solar); }

/* 업무 화면 보강 */
.page .main { padding: 0; }
.nav button { padding: 0 12px; font-size: 13.5px; white-space: nowrap; }
.nav button.on::after { left: 9px; right: 9px; }
.top-r { gap: 16px; }
.flash { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 90; background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 10px 16px; font-size: 13px; box-shadow: 0 10px 30px oklch(0 0 0 / .35); display: flex; align-items: center; animation: tin .25s ease-out; }
.cnt2 { font-family: 'IBM Plex Mono', monospace; font-size: 11px; background: var(--crit); color: #fff; border-radius: 9px; padding: 0 6px; line-height: 17px; }
.empty { display: flex; align-items: center; justify-content: center; }
.rs-pagelist { overflow: auto; }
.access-home { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 88px 100px; background: radial-gradient(ellipse at 50% 45%, color-mix(in oklch, var(--fc) 5%, transparent), transparent 62%); }
.access-shell { width: 100%; max-width: 1560px; }
.access-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 22px; }
.access-grid .access-card { max-height: none; flex: none; }
.access-grid .access-card { --accent: var(--fc); position: relative; isolation: isolate; display: flex; flex-direction: column; align-items: stretch; min-width: 0; height: 344px; padding: 0; overflow: hidden; border: 1px solid var(--line2); border-radius: 16px; background: linear-gradient(145deg, color-mix(in oklch, var(--panel2) 65%, var(--panel)), var(--panel)); color: var(--tx); text-align: left; cursor: pointer; gap: 0; box-shadow: 0 18px 40px -20px color-mix(in oklch, var(--tx) 16%, transparent), inset 0 1px 0 color-mix(in oklch, var(--tx) 6%, transparent); transition: border-color .22s ease, box-shadow .22s ease, transform .22s ease; }
.access-card:nth-child(1) { --accent: var(--solar); }
.access-card:nth-child(2) { --accent: var(--fc); }
.access-card:nth-child(3) { --accent: var(--ok); }
.access-card:nth-child(4) { --accent: var(--solar); }
.access-card:nth-child(5) { --accent: var(--fc); }
.access-grid .access-card:hover { border-color: color-mix(in oklch, var(--accent) 65%, var(--line2)); transform: translateY(-7px); box-shadow: 0 24px 46px -20px color-mix(in oklch, var(--accent) 23%, transparent); }
.access-grid .access-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
.access-card-top { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: radial-gradient(ellipse at 50% 50%, color-mix(in oklch, var(--accent) 9%, transparent), transparent 70%); }
.access-card-top::before { content: ''; position: absolute; inset: 24px; opacity: .32; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 24px 24px; mask-image: radial-gradient(ellipse, black 12%, transparent 70%); }
.access-orbit { position: absolute; width: 154px; height: 154px; border: 1px solid color-mix(in oklch, var(--accent) 14%, transparent); border-radius: 50%; }
.access-orbit::after { content: ''; position: absolute; inset: -17px; border-radius: 50%; border: 1px solid color-mix(in oklch, var(--accent) 6%, transparent); }
.access-icon { position: relative; display: flex; align-items: center; justify-content: center; width: 100px; height: 100px; border-radius: 25px; color: var(--accent); background: linear-gradient(145deg, color-mix(in oklch, var(--accent) 8%, var(--panel)), var(--panel)); border: 1px solid color-mix(in oklch, var(--accent) 25%, var(--line)); box-shadow: 0 12px 30px -16px color-mix(in oklch, var(--accent) 35%, transparent), inset 0 1px 0 color-mix(in oklch, var(--tx) 8%, transparent); transition: transform .22s ease; }
.access-card:hover .access-icon { transform: translateY(-3px); }
.access-corner { position: absolute; top: 23px; left: 24px; width: 22px; height: 3px; border-radius: 3px; background: color-mix(in oklch, var(--accent) 70%, var(--panel)); }
.access-card-bottom { min-height: 93px; padding: 24px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); background: color-mix(in oklch, var(--panel) 82%, transparent); }
.access-title { font-size: 20px; font-weight: 600; letter-spacing: -.035em; line-height: 1.5; white-space: nowrap; }
.access-arrow { width: 31px; height: 31px; flex: 0 0 auto; border: 1px solid var(--line2); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--tx3); transition: color .22s ease, border-color .22s ease; }
.access-card:hover .access-arrow { color: var(--accent); border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .access-grid .access-card, .access-icon, .access-arrow { transition: none; } .access-grid .access-card:hover, .access-card:hover .access-icon { transform: none; } }

/* 100% 고정. 한 화면에 주요 패널과 조작을 배치하고 긴 목록만 내부 탐색한다. */
.stage.readable-stage { width: 100vw; height: 100vh; left: 0; top: 0; transform: none; overflow: hidden; --text-scale: 1; }
.display-controls { --text-scale: 1; display: flex; justify-content: flex-end; padding: 5px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; height: 35px; font-size: 12px; }
.display-theme { display: flex; border: 1px solid var(--line2); border-radius: 5px; overflow: hidden; }
.display-theme button { padding: 2px 12px; font-size: 12px; color: var(--tx2); }
.display-theme button[aria-pressed="true"] { background: var(--sel); color: var(--tx); box-shadow: inset 0 -2px 0 var(--solar); }
.display-controls :focus-visible { outline: 2px solid var(--fc); outline-offset: 2px; }
.access-home { --text-scale: 1; }
.readable-stage[data-role="entry"] > [data-screen-label] { display: flex; align-items: stretch; overflow: auto; }
.readable-stage[data-role="entry"] .access-home { min-height: 420px; width: 100%; }
.readable-stage > [data-screen-label] { min-height: 0; overflow: hidden; }
.readable-stage .top { height: auto; min-height: 54px; padding: 6px 14px; flex-wrap: wrap; gap: 8px; flex-shrink: 0; }
.readable-stage .brand { padding-right: 10px; border: 0; }
.readable-stage .nav { height: auto; flex-wrap: wrap; margin-left: 0; gap: 2px; }
.readable-stage .nav button { min-height: 30px; height: auto; padding: 5px 8px; white-space: normal; font-size: calc(12px * var(--text-scale)); }
.readable-stage .top-r { height: auto; gap: 12px; flex-wrap: wrap; }
.readable-stage .top { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; }
.readable-stage .top .nav { min-width: 0; }

.readable-stage .mdl .pb { overflow: auto; }
@media (max-width: 1500px) {
  .readable-stage .main, .readable-stage .pgrid { grid-template-columns: minmax(0,1.4fr) minmax(0,1fr) !important; }
}
@media (max-width: 1100px) {
  .readable-stage .main, .readable-stage .pgrid, .readable-stage .df-flow .df-grid { grid-template-columns: minmax(0,1fr) !important; }
  .readable-stage .main > *, .readable-stage .pgrid > * { grid-column: auto !important; grid-row: auto !important; }
  .readable-stage .page .pgrid.overview-dashboard { grid-template-columns: minmax(0,1fr) !important; grid-template-rows: auto 400px 360px auto !important; }
  .readable-stage .overview-dashboard > :is(.kpis,.overview-chart,.overview-weather,.overview-detail) { grid-column: 1 / -1 !important; }
  .readable-stage .overview-dashboard .overview-weather > .panel { height: 360px; min-height: 360px; }
  .overview-dashboard > .kpis { grid-template-columns: repeat(3,minmax(0,1fr)); }
}
@media (max-width: 650px) {
  .readable-stage .page { padding: 12px; gap: 12px; }
  .overview-dashboard > .kpis { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .readable-stage .df-flow .df-preview { height: 360px; }
  .df-flow .df-canvas { min-height: 280px; }
}
</style><style id="inspection-031-style">/* Components for inspection 031, using the supplied AX theme and flow layout. */
.row-obb { fill: color-mix(in oklch,var(--fc) 22%,transparent); stroke: var(--fc); stroke-width: 2; vector-effect: non-scaling-stroke; }
.row-route-line { stroke: var(--solar); stroke-width: 2; fill: none; vector-effect: non-scaling-stroke; }
.row-waypoint circle { fill: var(--solar); stroke: var(--bg); stroke-width: 1; vector-effect: non-scaling-stroke; }
.row-waypoint text { fill: #171b1e; font-family: 'IBM Plex Mono',monospace; font-weight: 600; }
.row-waypoint-list { display: flex; gap: 6px; flex-wrap: wrap; max-height: 170px; overflow: auto; }
.inspection-031 progress { width: 100%; height: 8px; accent-color: var(--solar); }
.inspection-031 .df-grid { min-height: 0; }
.inspection-031 .df-primary { min-height: 0; }
.inspection-031 .fixed-map-canvas { width: 100%; height: 100%; min-height: 350px; position: relative; overflow: auto; }
.fixed-map-svg { display: block; width: 100%; height: 100%; min-height: 350px; touch-action: none; }
.fixed-row-label { font-size: 9px; fill: var(--tx3); }
.fixed-cell { cursor: pointer; }
.fixed-cell rect { stroke-width: 1; }
.fixed-cell text { font: 6px 'IBM Plex Mono',monospace; fill: var(--tx2); pointer-events: none; }
.fixed-cell.fixed-ok rect { fill: color-mix(in oklch,var(--ok) 12%,var(--panel)); stroke: var(--ok); }
.fixed-cell.fixed-soil rect { fill: color-mix(in oklch,var(--warn) 18%,var(--panel)); stroke: var(--warn); }
.fixed-cell.fixed-dmg rect { fill: color-mix(in oklch,var(--crit) 18%,var(--panel)); stroke: var(--crit); }
.fixed-cell.fixed-und rect { stroke: var(--line2); }
.fixed-cell .fixed-dirty-dot { fill: var(--warn); }
.fixed-cell:hover rect { stroke-width: 2; }
.fixed-cell.picked rect, .fixed-cell:focus-visible rect { stroke: var(--solar); stroke-width: 2; }
.fixed-cell:focus-visible { outline: none; }
.fixed-map-tools { display: flex; gap: 5px; position: absolute; top: 0; right: 0; }
.fixed-detail-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.fixed-evidence { width: 100%; max-height: 230px; object-fit: contain; background: var(--bg); border: 1px solid var(--line); }
.fixed-crop { width: 100%; height: 120px; object-fit: contain; background: var(--bg); border: 1px solid var(--line); }
.inspection-031 .kv-list dd { overflow-wrap: anywhere; }
@media(max-width:900px) {
  .inspection-031 .df-primary { min-height: 380px; }
  .inspection-031 .fixed-map-canvas { min-height: 350px; }
}
.fixed-panel-details { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.fixed-detail-images { display: grid; grid-template-columns: minmax(0,1.7fr) minmax(0,1fr); gap: 8px; }
.fixed-detail-images > a { display: block; min-width: 0; }
.fixed-detail-images .fixed-evidence, .fixed-detail-images .fixed-crop { height: clamp(90px,16vh,165px); max-height: none; }
.inspection-031 .fixed-detail-view { gap: 8px; }
.fixed-detail-view .fixed-summary-back { align-self: flex-start; }
.fixed-detail-view .kv-list { row-gap: 5px; font-size: 12px; }
.fixed-detail-view .df-field { gap: 3px; }
.fixed-detail-view .df-hint { font-size: 10px; }
</style><style id="agentstream-widget-style">.axchat { position: fixed; right: 24px; bottom: 22px; z-index: 2147483000; font-family: var(--font-text,system-ui,sans-serif); font-size: 13px; color: var(--tx); line-height: 1.5; }
.axchat button,.axchat textarea { font: inherit; }
.axchat button { cursor: pointer; }
.axchat button:disabled { cursor: default; opacity: .45; }
.axchat :focus-visible { outline: 2px solid var(--solar); outline-offset: 3px; }
.axchat-launcher { margin-left: auto; display: flex; align-items: center; gap: 9px; height: 54px; padding: 0 20px; background: var(--solar); color: #201a0d; border: 1px solid color-mix(in oklch,var(--solar) 80%,white); border-radius: 28px; font-weight: 700!important; box-shadow: 0 5px 24px #0005; transition: transform .15s; }
.axchat-launcher:hover { transform: translateY(-2px); }
.axchat-panel { position: absolute; bottom: 68px; right: 0; width: 390px; height: min(600px,calc(100dvh - 120px)); display: flex; flex-direction: column; overflow: hidden; background: var(--panel); border: 1px solid var(--line2); border-radius: 16px; box-shadow: 0 16px 60px #0006; }
.axchat-header { display: flex; align-items: center; gap: 10px; flex: none; padding: 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.axchat-mark,.axchat-welcome-icon { display: grid; place-items: center; color: var(--solar); background: var(--sel); border: 1px solid color-mix(in oklch,var(--solar) 25%,var(--line)); border-radius: 12px; width: 40px; height: 40px; }
.axchat-heading { flex: 1; }
.axchat-heading h2 { margin: 0; font-size: 15px; font-weight: 650; }
.axchat-connection { display: flex; gap: 5px; align-items: center; font-size: 11px; color: var(--tx3); }
.axchat-connection i { width: 6px; height: 6px; border-radius: 50%; background: var(--tx3); }
.axchat-connection i[data-status=healthy] { background: var(--ok); }
.axchat-connection i[data-status=unhealthy] { background: var(--warn); }
.axchat-icon { display: grid; place-items: center; padding: 5px; width: 30px; height: 30px; border: 0; border-radius: 6px; color: var(--tx2); background: transparent; }
.axchat-icon:hover { color: var(--tx); background: var(--panel2); }
.axchat-messages { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.axchat-welcome { padding: 30px 10px; margin: auto 0; text-align: center; }
.axchat-welcome-icon { width: 50px; height: 50px; margin: 0 auto 16px; }
.axchat-welcome h3 { margin: 0 0 6px; font-size: 18px; letter-spacing: -.03em; }
.axchat-welcome p { margin: 0; color: var(--tx3); font-size: 12px; }
.axchat-suggestion { padding: 10px 12px; margin-top: 24px; border: 1px solid var(--line2); border-radius: 8px; color: var(--tx2); background: var(--panel2); font-size: 12px!important; }
.axchat-suggestion:hover { border-color: var(--solar); color: var(--tx); }
.axchat-message { max-width: 92%; }
.axchat-user { align-self: flex-end; }
.axchat-assistant { align-self: flex-start; }
.axchat-author { margin-bottom: 5px; color: var(--tx3); font-size: 10px; }
.axchat-user .axchat-author { text-align: right; }
.axchat-bubble { padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel2); font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; white-space: pre-wrap; }
.axchat-user .axchat-bubble { background: var(--sel); border-color: color-mix(in oklch,var(--solar) 24%,var(--line)); }
.axchat-turn-status { font-size: 10px; color: var(--tx3); padding-top: 4px; }
.axchat-typing { color: var(--tx2); }
.axchat-typing span { animation: axchat-pulse 1.2s infinite; }
@keyframes axchat-pulse { 50% { opacity: .3; } }
.axchat-error { padding: 9px 15px; margin: 0 12px 8px; font-size: 12px; background: color-mix(in oklch,var(--crit) 8%,var(--panel)); border: 1px solid color-mix(in oklch,var(--crit) 30%,var(--line)); border-radius: 8px; color: var(--tx2); }
.axchat-error button { color: var(--solar); padding: 2px 8px; background: none; border: 0; text-decoration: underline; }
.axchat-compose { flex: none; display: flex; gap: 8px; align-items: flex-end; margin: 0 12px; padding: 9px; border: 1px solid var(--line2); border-radius: 10px; background: var(--bg); }
.axchat-compose:focus-within { border-color: var(--solar); }
.axchat-compose textarea { min-width: 0; flex: 1; resize: none; min-height: 38px; max-height: 120px; border: 0; outline: none; background: transparent; color: var(--tx); padding: 3px; font-size: 13px; }
.axchat-compose textarea::placeholder { color: var(--tx3); }
.axchat-send { display: grid; place-items: center; border: 0; border-radius: 8px; background: var(--solar); color: #201a0d; width: 34px; height: 34px; flex: none; }
.axchat-stop { background: var(--panel2); color: var(--tx); border: 1px solid var(--line2); }
.axchat-footer { flex: none; padding: 8px 10px 12px; text-align: center; font-size: 10px; color: var(--tx3); }
@media(max-width:480px) { .axchat { right: 12px; bottom: max(14px,env(safe-area-inset-bottom)); } .axchat-panel { width: calc(100vw - 24px); height: min(570px,calc(100dvh - 108px)); } .axchat-launcher { height: 50px; padding: 0 17px; } }
@media(prefers-reduced-motion:reduce) { .axchat * { animation: none!important; transition: none!important; scroll-behavior: auto!important; } }
.axchat .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.axchat-compose textarea:focus-visible { outline: none; }
